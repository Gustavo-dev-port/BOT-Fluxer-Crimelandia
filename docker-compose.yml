# Produção: bot + PostgreSQL.
# O módulo de música (Lavalink) não entra: o Lavalink só fala com a voz do Discord,
# e o Fluxer usa LiveKit. Veja a seção "Música" do README.
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fluxer}:${POSTGRES_PASSWORD:-fluxer}@postgres:5432/${POSTGRES_DB:-fluxer}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot-logs:/app/logs

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluxer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxer}
      POSTGRES_DB: ${POSTGRES_DB:-fluxer}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fluxer} -d ${POSTGRES_DB:-fluxer}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  bot-logs:
